name: shared-catalogue-adapter
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source-export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: 22, package-manager-cache: false}
      - run: node --test tests_shared/*.test.mjs
      - run: node scripts/export-shared-catalogue.mjs
      - run: echo 'Shared-engine integration requires the separately pinned private engine checkout; this job checks only the adapter and actual source export.' >> "$GITHUB_STEP_SUMMARY"
