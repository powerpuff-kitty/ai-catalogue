name: procedural-projects
on:
  pull_request:
    paths:
      - 'research/procedural-projects/**'
      - 'primitives/**'
      - '.github/workflows/procedural-projects.yml'
  push:
    paths:
      - 'research/procedural-projects/**'
      - 'primitives/**'
      - '.github/workflows/procedural-projects.yml'
permissions:
  contents: read
jobs:
  validate-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Reuse the action revisions already pinned by this repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: 22, package-manager-cache: false}
      - run: node --test research/procedural-projects/catalogue.test.mjs
      - run: node research/procedural-projects/catalogue.mjs --verify-canonical
      - run: node research/procedural-projects/catalogue.mjs --check
